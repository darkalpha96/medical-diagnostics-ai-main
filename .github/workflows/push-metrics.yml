name: Push metrics

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off-peak minutes
  workflow_dispatch:

concurrency:
  group: push-metrics
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: medical-diagnosis-ai-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: medical-diagnosis-ai-main/requirements.txt

      - run: pip install -r requirements.txt

      - run: python push_once.py
        env:
          PYTHONUNBUFFERED: "1"
          RUN_SECONDS: "840"
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SYSTEM_ID: ${{ secrets.SYSTEM_ID }}
